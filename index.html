<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Stock bus"><title>Stock du bus</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : une colonne étroite pour le téléphone. Bandeau d'alerte, barre d'outils (filtres, catégories), puis la liste groupée par catégorie. Chaque ligne a deux zones : le nom (ouvre la fiche) et la pastille de stock (ouvre un éditeur avec Valider / Annuler). */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --surface-2: #E1E8EC;
  --ink: #182126;
  --muted: #56666F;
  --line: #D3DCE1;
  --accent: #0B6E8A;
  --accent-on: #FFFFFF;
  --alert: #B3261E;
  --alert-on: #FFFFFF;
  --alert-bg: #FCE8E6;
  --alert-ink: #8C1D17;
  --ok: #1B7A4B;
  --ok-bg: #E1F3E9;
  --warn: #8F5200;
  --warn-bg: #FBEBD0;
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161A;
    --surface: #182026;
    --surface-2: #222D34;
    --ink: #E6EDF0;
    --muted: #8FA1AB;
    --line: #2B3841;
    --accent: #5CC0DC;
    --accent-on: #06222B;
    --alert: #FF7A70;
    --alert-on: #2A0E0C;
    --alert-bg: #3A1B19;
    --alert-ink: #FFB0A8;
    --ok: #5FD59A;
    --ok-bg: #153024;
    --warn: #F0B04F;
    --warn-bg: #3A2C10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161A;
  --surface: #182026;
  --surface-2: #222D34;
  --ink: #E6EDF0;
  --muted: #8FA1AB;
  --line: #2B3841;
  --accent: #5CC0DC;
  --accent-on: #06222B;
  --alert: #FF7A70;
  --alert-on: #2A0E0C;
  --alert-bg: #3A1B19;
  --alert-ink: #FFB0A8;
  --ok: #5FD59A;
  --ok-bg: #153024;
  --warn: #F0B04F;
  --warn-bg: #3A2C10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
h1 { margin: 0; font: 700 40px/1 var(--font-display); letter-spacing: .01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

button { font-family: inherit; }
.btn {
  min-height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: 600 15px var(--font-body); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.btn.danger { border-color: var(--alert); color: var(--alert); background: transparent; }
.btn.danger.confirm { background: var(--alert); color: var(--alert-on); }
.linkbtn {
  background: none; border: 0; color: var(--muted); font: 500 14px var(--font-body);
  text-decoration: underline; min-height: 44px; cursor: pointer; justify-self: center;
}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { margin: -4px 0 0; font-size: 14px; color: var(--muted); }

/* Formulaires */
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
input[type="text"], input[type="number"], select {
  min-height: 46px; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px;
  background: var(--bg); color: var(--ink); font: 16px var(--font-body);
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel form { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Bandeau d'alerte */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: 14px; padding: 12px 16px; }
.banner.alert { background: var(--alert-bg); color: var(--alert-ink); }
.banner.ok { background: var(--ok-bg); color: var(--ok); font: 600 20px/1.2 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }
.banner .n { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums; margin-right: 8px; }
.banner .t { font: 600 20px/1.1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; }

/* Barre d'outils */
.toolbar { display: grid; gap: 10px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.tools { display: flex; gap: 8px; align-items: center; }
.tools select { flex: 1; min-width: 0; }
.tools .btn { flex: none; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 500 14px var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* Liste */
.group { display: grid; gap: 8px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 4px; }
h2 { margin: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
.hint { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: center;
  padding: 10px 12px 10px 14px; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row.alert { background: var(--alert-bg); }

.main {
  display: flex; align-items: center; gap: 12px; min-width: 0; background: none; border: 0; padding: 6px 0; margin: 0;
  text-align: left; color: inherit; font: inherit; cursor: pointer;
}
.main::after { content: "\203A"; margin-left: auto; color: var(--muted); font-size: 22px; line-height: 1; padding-left: 4px; }
.main[aria-expanded="true"]::after { transform: rotate(90deg); }
.thumb { width: 84px; height: 64px; border-radius: 10px; object-fit: contain; flex: none; background: var(--surface-2); border: 1px solid var(--line); }
.txt { min-width: 0; display: grid; gap: 2px; }
.name { font-weight: 600; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 8px; }
.attrs { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.row.alert .meta, .row.alert .attrs { color: var(--alert-ink); }
.badge {
  background: var(--alert); color: var(--alert-on); border-radius: 6px; padding: 1px 8px; white-space: nowrap;
  font: 700 13px/1.5 var(--font-display); letter-spacing: .06em; text-transform: uppercase;
}
.tag { font: 500 12px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }

.qtybtn {
  min-width: 72px; min-height: 58px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  color: var(--ink); display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px 10px; cursor: pointer;
}
.qtybtn .q { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.qtybtn .q.word { font-size: 22px; letter-spacing: .02em; }
.qtybtn .ql { font: 500 11px/1 var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.row.alert .qtybtn { border-color: var(--alert); }
.row.alert .qtybtn .q { color: var(--alert-ink); }
.qtybtn.lvl-plein { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.qtybtn.lvl-moitie { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.qtybtn.lvl-bas { background: var(--alert); border-color: var(--alert); color: var(--alert-on); }
.qtybtn.lvl-bas .ql, .qtybtn.lvl-plein .ql, .qtybtn.lvl-moitie .ql { color: inherit; opacity: .8; }
.row.alert .qtybtn.lvl-bas .q { color: var(--alert-on); }

/* Panneaux ouverts sous une ligne */
.sheet { grid-column: 1 / -1; margin-top: 8px; padding-top: 14px; border-top: 1px dashed var(--line); display: grid; gap: 14px; }
.sheet > .btn.danger { margin-top: 10px; }
.ed-note { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
.ed-step { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; gap: 16px; align-items: center; }
.ed-input {
  text-align: center; min-height: 64px; font: 700 38px var(--font-display); font-variant-numeric: tabular-nums;
  padding: 0 8px; border-radius: 12px;
}
.step {
  width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 600 26px/1 var(--font-body); cursor: pointer;
}
.step:active { background: var(--surface-2); }
.step:disabled { opacity: .4; cursor: default; }
.step.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-on); }
.step.big { width: 64px; height: 64px; font-size: 32px; border-radius: 14px; }
.ed-levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ed-levels button {
  min-height: 58px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
  color: var(--ink); font: 600 16px var(--font-body); cursor: pointer;
}
.ed-levels button[aria-pressed="true"][data-val="plein"] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.ed-levels button[aria-pressed="true"][data-val="moitie"] { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.ed-levels button[aria-pressed="true"][data-val="bas"] { background: var(--alert); border-color: var(--alert); color: var(--alert-on); }
.ed-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.fields label.wide { grid-column: 1 / -1; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.photo { display: grid; gap: 10px; }
.photo img { width: 100%; max-height: 380px; object-fit: contain; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.photo-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
.filebtn:focus-within, .addphoto:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.addphoto {
  display: flex; align-items: center; justify-content: center; min-height: 96px; border: 2px dashed var(--line);
  border-radius: 12px; cursor: pointer; color: var(--muted); font: 600 16px var(--font-body);
}
.photo-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-pick .addphoto { text-align: center; padding: 8px; }
.photo-pick.has .addphoto { min-height: 46px; border-style: solid; font-size: 15px; }
.newphoto { display: grid; gap: 10px; }
#f-prev { width: 100%; max-height: 260px; object-fit: contain; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); display: block; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* Catégories */
.catrow { display: grid; padding: 6px 14px; border-top: 1px solid var(--line); }
.catrow:first-child { border-top: 0; }
.catrow.sub { padding-left: 32px; }
.catrow .main { width: 100%; }
.sub-h { margin: 0; font: 600 13px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.flist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flist li { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.flist .btn { min-height: 40px; padding: 0 12px; font-size: 14px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.inline .btn { flex: none; }

/* Commande */
.order-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.oline { grid-template-columns: auto minmax(0, 1fr) auto; }
.row.oline.off { opacity: .55; }
.info { min-width: 0; display: grid; gap: 2px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.qty { min-width: 2.4ch; text-align: center; font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.check { width: 26px; height: 26px; accent-color: var(--accent); margin: 0; }
.export { display: flex; gap: 8px; flex-wrap: wrap; }
.total { color: var(--muted); font-size: 14px; margin: 0; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); margin: 0; }
.backup { display: flex; gap: 4px 20px; justify-content: center; flex-wrap: wrap; }
.backup .linkbtn { display: inline-flex; align-items: center; }

/* Sauvegardes : rappel d'export et copies automatiques */
.bk { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-radius: 14px; padding: 12px 16px; background: var(--warn-bg); color: var(--warn); }
.bk p { margin: 0; font-weight: 600; }
.bk .btn { flex: none; }
.snaps { display: grid; gap: 12px; }

/* Photo agrandie */
.zoom {
  position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .92); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  cursor: zoom-out;
}
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.zoom-x {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px));
  color: #fff; background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 8px 14px; font: 600 15px var(--font-body);
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px;
  border-radius: 10px; font-weight: 500; z-index: 40; text-align: center;
}

@media (max-width: 460px) {
  .fields, .two { grid-template-columns: 1fr; }
  h1 { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header>
    <div>
      <h1>Stock du bus</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button type="button" class="btn primary" id="addBtn" data-action="add" aria-expanded="false">+ Ajouter</button>
  </header>
  <p class="notice" id="notice" hidden></p>
  <section class="bk" id="bkBanner" role="status" hidden></section>

  <section class="panel" id="addBox" hidden aria-label="Nouvel article">
    <form id="addForm">
      <label for="f-nom"><span id="f-nom-lbl">Nom</span>
        <input id="f-nom" type="text" autocomplete="off" placeholder="Ex. Fusibles 5×20 mm 2 A">
      </label>
      <div class="newphoto">
        <img id="f-prev" alt="Aperçu de la photo" hidden>
        <div class="photo-pick" id="f-photo-pick">
          <label class="addphoto" id="f-photo-lbl" for="f-photo-cam">Prendre une photo</label>
          <label class="addphoto" id="f-photo-lbl2" for="f-photo">Choisir dans la galerie</label>
        </div>
        <input id="f-photo-cam" class="sr" type="file" accept="image/*" capture="environment">
        <input id="f-photo" class="sr" type="file" accept="image/*">
        <button type="button" class="btn" id="f-photo-del" data-action="new-photo-del" hidden>Retirer la photo</button>
      </div>
      <label for="f-cat">Catégorie
        <select id="f-cat"></select>
      </label>
      <div class="fields" id="f-attrs" hidden></div>
      <div class="two">
        <label for="f-type">Type
          <select id="f-type">
            <option value="unite">Compté à l’unité</option>
            <option value="niveau">Visserie ou vrac (niveau)</option>
          </select>
        </label>
        <label for="f-fourn">Fournisseur
          <input id="f-fourn" type="text" autocomplete="off" placeholder="Facultatif">
        </label>
        <label for="f-ref">Référence
          <input id="f-ref" type="text" autocomplete="off" placeholder="Facultatif">
        </label>
      </div>
      <div class="two" id="f-unit-fields">
        <label for="f-qty">Quantité en stock
          <input id="f-qty" type="number" inputmode="numeric" min="0" step="1" value="0">
        </label>
        <label for="f-seuil">Seuil d’alerte
          <input id="f-seuil" type="number" inputmode="numeric" min="0" step="1" value="1">
        </label>
      </div>
      <div class="ed-actions">
        <button type="button" class="btn" data-action="add-cancel">Annuler</button>
        <button type="submit" class="btn primary">Ajouter</button>
      </div>
    </form>
  </section>

  <section class="panel" id="catBox" hidden aria-label="Nouvelle catégorie">
    <form id="catForm">
      <label for="c-new">Nouvelle catégorie
        <input id="c-new" type="text" autocomplete="off" placeholder="Ex. Câbles">
      </label>
      <button type="submit" class="btn primary">Ajouter la catégorie</button>
    </form>
  </section>

  <section class="panel snaps" id="snapBox" aria-label="Sauvegardes automatiques" hidden></section>

  <section id="banner" aria-live="polite" hidden></section>
  <div class="toolbar" id="toolbar" hidden></div>
  <main id="list"></main>
  <footer class="backup" id="backup">
    <button type="button" class="linkbtn" data-action="export">Sauvegarder mes données</button>
    <button type="button" class="linkbtn" id="snapLink" data-action="snaps" hidden>Copies automatiques</button>
    <label class="linkbtn" for="import-file">Restaurer une sauvegarde</label>
    <input id="import-file" class="sr" type="file" accept=".json,application/json">
  </footer>
</div>

<div class="zoom" id="zoom" data-action="zoom-close" role="dialog" aria-label="Photo agrandie" hidden>
  <img id="zoomImg" alt="Photo agrandie">
  <span class="zoom-x">Fermer ✕</span>
</div>
<div class="toast" id="toast" role="status" hidden></div>

        }, onError);
      },
      add: function (name, data) { return col(name).add(data).then(function (r) { return r.id; }); },
      update: function (name, id, patch) { return col(name).doc(id).update(patch); },
      remove: function (name, id) { return col(name).doc(id).delete(); },
      putMany: async function (name, list) {

  function makeLocalStore() {
    var KEYS = { articles: 'stock-bus-v1', categories: 'stock-bus-cats-v1' };
    var data = {}, cbs = {};
    Object.keys(KEYS).forEach(function (n) {
      var v = [];
      try { v = JSON.parse(localStorage.getItem(KEYS[n]) || '[]'); } catch (e) { v = []; }
      data[n] = Array.isArray(v) ? v : [];
    });
    function save(n) {
      try { localStorage.setItem(KEYS[n], JSON.stringify(data[n])); }
      catch (e) { toast('Mémoire de l’appareil pleine : les dernières modifications ne sont pas enregistrées. Sauvegarde tes données et retire des photos.'); }
    }
    function emit(n) { if (cbs[n]) cbs[n](data[n].slice()); }
    return {
      local: true,
      subscribe: function (name, fn) { cbs[name] = fn; fn(data[name].slice()); },
      add: function (name, d) {
        var id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        data[name].push(Object.assign({ id: id }, d)); save(name); emit(name);
        return Promise.resolve(id);
      },
      update: function (name, id, patch) {
        data[name] = data[name].map(function (i) { return i.id === id ? Object.assign({}, i, patch) : i; });
        save(name); return Promise.resolve();
      },
      remove: function (name, id) {
        data[name] = data[name].filter(function (i) { return i.id !== id; }); save(name);
        return Promise.resolve();
      },
      putMany: function (name, list) {
        list.forEach(function (n) {
          var k = data[name].findIndex(function (x) { return x.id === n.id; });
          if (k >= 0) data[name][k] = Object.assign({}, data[name][k], n); else data[name].push(n);

        return Promise.resolve();
      },

      replaceAll: function (name, list) {

        save(name); emit(name);
        return Promise.resolve();
      }
    };
  }

  /* ---------- photo ---------- */
  function shrink(file, max, q) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);

      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image illisible, essaie un JPEG ou un PNG')); };
      img.src = url;
    });
  }
  function toDataUrl(blob) {
    return new Promise(function (resolve, reject) {

      r.onerror = function () { reject(new Error('lecture impossible')); };

  async function makePhotoData(file) {
    var url = await toDataUrl(await shrink(file, 960, 0.72));

    if (url.length > 215000) url = await toDataUrl(await shrink(file, 480, 0.6));
    if (url.length > 220000) throw new Error('photo trop lourde');
    return url;
  }

  /* ---------- copies automatiques (une par jour, dans l'appareil) ---------- */

      t: new Date().toISOString(),
      articles: state.items.map(function (a) { var c = Object.assign({}, a); delete c.photoData; return c; }),
      categories: state.cats.map(function (c) { return Object.assign({}, c); })
    };
    Object.keys(snaps).sort().slice(0, -SNAP_KEEP).forEach(function (k) { delete snaps[k]; });
    var ok = lsSet(SNAP_KEY, JSON.stringify(snaps));
    while (!ok) {   // mémoire pleine : on retire la plus ancienne copie et on réessaie
      var oldest = Object.keys(snaps).sort().filter(function (k) { return k !== key; })[0];
      if (!oldest) break;

    notice.textContent = 'La connexion au stock est interrompue. Recharge la page.';
    if (state.adding) syncAddForm();
    if (v === 'order') { $('#banner').hidden = true; $('#toolbar').hidden = true; renderOrder(); }
    else if (v === 'cats') { $('#banner').hidden = true; $('#toolbar').hidden = true; renderCats(); }
    else { renderBanner(); renderToolbar(); renderList(); }
    var z = $('#zoom');
    z.hidden = !state.zoom;
    if (state.zoom) $('#zoomImg').src = state.zoom;
    if (key) {
      var el = [].slice.call(document.querySelectorAll('[data-action]')).find(function (x) {
        return x.dataset.action === key[0] && (x.dataset.id || '') === key[1] && (x.dataset.val || '') === key[2];
      });
      if (el && !el.disabled && el !== document.activeElement && el.id !== 'zoom') el.focus({ preventScroll: true });
    }
  }

  /* ---------- actions ---------- */
  function okQty() {
    var d = state.qty;
    if (!d) return;
    var it = find(d.id);
    var input = $('#ed-val');
    state.qty = null;
    if (it) {
      if (isLevel(it)) changeItem(it.id, { etat: d.value });
      else changeItem(it.id, { quantite: Math.max(0, parseInt(input ? input.value : d.value, 10) || 0) });
      toast('Stock mis à jour');
    } else render();
  }
  function readInput(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var act = b.dataset.action, id = b.dataset.id, val = b.dataset.val;
    var it = id ? find(id) : null;
    var c = id ? cat(id) : null;
    if (!KEEP_CONFIRM[act]) state.confirm = null;
    if (act === 'add') {
      state.adding = !state.adding; render();
      if (state.adding) $('#f-nom').focus();
    } else if (act === 'add-cancel') {
      state.adding = false; resetAddForm(); render();
    } else if (act === 'open') {
      state.qty = null; state.editFiche = null; state.open = state.open === id ? null : id; render();
    } else if (act === 'qty' && it) {
      state.open = null; state.editFiche = null;
      state.qty = (state.qty && state.qty.id === id) ? null : { id: id, value: isLevel(it) ? (it.etat || 'plein') : num(it.quantite) };
      render();
    } else if (act === 'ed-dec' || act === 'ed-inc') {
      var inp = $('#ed-val');
      if (inp && state.qty) {
        var v = Math.max(0, (parseInt(inp.value, 10) || 0) + (act === 'ed-inc' ? 1 : -1));
        inp.value = String(v); state.qty.value = v;
      }
    } else if (act === 'ed-level') {
      if (state.qty) { state.qty.value = val; render(); }
    } else if (act === 'ed-cancel') {
      state.qty = null; render();
    } else if (act === 'ed-ok') {
      okQty();
    } else if (act === 'filter') {
      state.filter = val; render();
    } else if (act === 'cats') {
      state.view = 'cats'; state.open = null; state.qty = null; state.editFiche = null; state.adding = false; render(); window.scrollTo(0, 0);
    } else if (act === 'cat-open') {
      state.catOpen = state.catOpen === id ? null : id; render();
    } else if (act === 'cat-field-add' && c) {
      var fname = readInput('nf-' + id).trim();
      if (!fname) { toast('Donne un nom au champ.'); }
      else if (fieldsFor(id).some(function (f) { return f.nom.toLowerCase() === fname.toLowerCase(); })) { toast('Ce champ existe déjà.'); }
      else changeCat(id, { champs: (c.champs || []).concat([{ id: newId('f'), nom: fname }]) });
    } else if (act === 'cat-field-del' && c) {
      var ck = 'field:' + id + ':' + val;
      if (state.confirm === ck) { state.confirm = null; changeCat(id, { champs: (c.champs || []).filter(function (f) { return f.id !== val; }) }); }
      else { state.confirm = ck; render(); }
    } else if (act === 'cat-sub-add' && c) {
      addCategory(readInput('ns-' + id), id).then(function (nid) { if (nid) { state.catOpen = nid; render(); } });
    } else if (act === 'cat-del' && c) {
      if (subsOf(id).length || countIn(id)) {
        state.confirm = null;
        toast('Impossible : retire d’abord les sous-catégories et change la catégorie des articles concernés.');
        render();
      } else if (state.confirm === 'cat:' + id) {
        state.confirm = null; state.catOpen = null; removeDoc('categories', id).then(render);
      } else { state.confirm = 'cat:' + id; render(); }
    } else if (act === 'order') {
      state.view = 'order'; state.open = null; state.editFiche = null; state.qty = null; render(); window.scrollTo(0, 0);
    } else if (act === 'back') {
      state.view = 'stock'; render(); window.scrollTo(0, 0);
    } else if (act === 'toggle') {
      state.excluded[id] = !state.excluded[id]; render();
    } else if (act === 'q-inc' && it) changeItem(id, { qte_cmd: qtyCmd(it) + 1 });
    else if (act === 'q-dec' && it) changeItem(id, { qte_cmd: Math.max(1, qtyCmd(it) - 1) });
    else if (act === 'export') exportData();
    else if (act === 'copy-order') copyOrder();
    else if (act === 'csv') saveCsv();
    else if (act === 'fiche-edit') { state.editFiche = id; render(); }
    else if (act === 'fiche-done') { state.editFiche = null; state.confirm = null; render(); }
    else if (act === 'new-photo-del') resetNewPhoto();
    else if (act === 'photo-del') {
      if (state.confirm === 'photo:' + id) { state.confirm = null; changeItem(id, { photoData: '' }); }
      else { state.confirm = 'photo:' + id; render(); }
    }
    else if (act === 'zoom') { state.zoom = it && it.photoData ? it.photoData : null; render(); }
    else if (act === 'zoom-close') { state.zoom = null; render(); }
    else if (act === 'del') {
      if (state.confirm === id) { state.confirm = null; state.open = null; removeItem(id).then(render); }
      else { state.confirm = id; }
      render();
    } else if (act === 'del-examples') {
      if (state.confirm === 'examples') { state.confirm = null; removeExamples().then(render); }
      else { state.confirm = 'examples'; }
      render();
    } else if (act === 'snaps') {
      state.snapOpen = !state.snapOpen; render();
    } else if (act === 'snap-restore' && val) {
      if (state.confirm === 'snap:' + val) { state.confirm = null; restoreSnap(val); }
      else { state.confirm = 'snap:' + val; render(); }
    } else render();
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'ed-val' && state.qty) state.qty.value = parseInt(e.target.value, 10) || 0;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (state.zoom) { state.zoom = null; render(); }
      else if (state.qty) { state.qty = null; render(); }
    } else if (e.key === 'Enter' && e.target && e.target.id === 'ed-val') {
      e.preventDefault(); okQty();
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (!el || !el.dataset) return;
    if (el.id === 'catFilter') {
      state.catFilter = el.value; render();
    } else if (el.id === 'f-cat') {
      syncAddForm();
    } else if (el.dataset.catfield) {
      var cv = el.value.trim();
      var cc = cat(el.dataset.id);
      if (!cv) { el.value = cc ? cc.nom || '' : ''; toast('Le nom ne peut pas être vide.'); return; }
      changeCat(el.dataset.id, { nom: cv }, true);
    } else if (el.dataset.field) {
      var v = el.type === 'number' ? Math.max(0, parseInt(el.value, 10) || 0) : el.value.trim();
      if (el.dataset.field === 'nom' && !v) {
        var cur = find(el.dataset.id);
        if (!cur || !fieldsFor(cur.catId).length) {
          el.value = cur ? cur.nom || '' : '';
          toast('Le nom ne peut pas être vide.');
          return;
        }
      }
      var patch = {}; patch[el.dataset.field] = v;
      changeItem(el.dataset.id, patch, el.dataset.field !== 'seuil' && el.dataset.field !== 'catId');
    } else if (el.dataset.photo) {
      var f = el.files && el.files[0];
      el.value = '';
      uploadPhoto(el.dataset.photo, f);
    } else if (el.id === 'import-file') {
      var imf = el.files && el.files[0];
      el.value = '';
      importData(imf);
    } else if (el.id === 'f-photo' || el.id === 'f-photo-cam') {
      var nf = el.files && el.files[0];
      el.value = '';
      pickNewPhoto(nf);
    }
  });

  function syncType() { $('#f-unit-fields').hidden = $('#f-type').value === 'niveau'; }
  $('#f-type').addEventListener('change', syncType);
  $('#addForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!store) { toast('Le stock se charge encore, patiente un instant.'); return; }
    var nom = $('#f-nom').value.trim();
    var catId0 = $('#f-cat').value;
    var hasAttr = !!catId0 && fieldsFor(catId0).some(function (f) { return readInput('f-a-' + f.id).trim(); });
    if (!nom && !hasAttr) {
      toast(catId0 && fieldsFor(catId0).length ? 'Donne un nom ou remplis au moins un champ.' : 'Donne un nom à l’article.');
      $('#f-nom').focus(); return;
    }
    var type = $('#f-type').value;
    var data = type === 'niveau'
      ? { nom: nom, type: 'niveau', etat: 'plein' }
      : { nom: nom, type: 'unite', quantite: Math.max(0, parseInt($('#f-qty').value, 10) || 0), seuil: Math.max(0, parseInt($('#f-seuil').value, 10) || 0) };
    var four = $('#f-fourn').value.trim();
    if (four) data.fournisseur = four;
    var ref = $('#f-ref').value.trim();
    if (ref) data.reference = ref;
    var catId = $('#f-cat').value;
    if (catId) {
      data.catId = catId;
      fieldsFor(catId).forEach(function (f) {
        var av = readInput('f-a-' + f.id).trim();
        if (av) data[attrKey(f)] = av;
      });
    }
    if (state.newPhoto) data.photoData = state.newPhoto;
    try { await store.add('articles', data); } catch (err) { notifyError(err); return; }
    resetAddForm();
    state.adding = false; render();
    toast('Article ajouté');
  });
  $('#catForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!store) return;
    var nid = await addCategory($('#c-new').value, '');
    if (nid) { $('#c-new').value = ''; state.catOpen = nid; render(); }
  });

  /* ---------- démarrage ---------- */
  async function boot() {
    render();
    var db = null;
    try { db = (window.claude && window.claude.use) ? await window.claude.use('db') : null; } catch (e) { db = null; }
    try { state.downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { state.downloads = null; }
    try { if (!db && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    store = db ? makeDbStore(db) : makeLocalStore();
    var onErr = function () { state.error = true; render(); };
    store.subscribe('articles', function (l) { applyList('articles', l); }, onErr);
    store.subscribe('categories', function (l) { applyList('categories', l); }, onErr);
  }
  /* Si l'app reste ouverte d'un jour à l'autre, la copie du nouveau jour se fait au retour dessus. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { takeSnapshot(); render(); }
  });
  boot();
})();
</script>

</body></html>
